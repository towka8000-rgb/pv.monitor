<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мониторинг принтеров HP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1d23;
    color: #e2e8f0;
    min-height: 100vh;
  }

  header {
    background: #111318;
    border-bottom: 1px solid #2d3348;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 600; color: #f1f5f9; letter-spacing: .3px; }
  .header-sub { font-size: 12px; color: #64748b; margin-top: 2px; }

  .main-nav { display: flex; gap: 4px; }
  .nav-link {
    text-decoration: none; font-size: 13px; font-weight: 500;
    padding: 6px 14px; border-radius: 6px; color: #64748b;
    border: 1px solid transparent; transition: all .15s;
  }
  .nav-link:hover { color: #e2e8f0; background: #1e2330; border-color: #2d3348; }
  .nav-active { color: #e2e8f0 !important; background: #1e2330 !important; border-color: #3b82f6 !important; }

  .add-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .add-bar label { font-size: 12px; color: #94a3b8; margin-right: 2px; }
  .add-bar input, .add-bar select {
    background: #1e2330;
    border: 1px solid #2d3348;
    border-radius: 6px;
    color: #e2e8f0;
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    transition: border-color .15s;
  }
  .add-bar input:focus, .add-bar select:focus { border-color: #3b82f6; }
  input#ip       { width: 140px; }
  input#location { width: 130px; }
  input#max      { width: 80px; }
  select#ptype   { width: 100px; cursor: pointer; }

  .btn {
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500; padding: 7px 14px;
    transition: opacity .15s, background .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-refresh { background: #1e2330; color: #94a3b8; border: 1px solid #2d3348; }
  .btn-sm      { padding: 4px 10px; font-size: 12px; }
  .btn-danger  { background: #7f1d1d; color: #fca5a5; }
  .btn-replace { background: #1e3a5f; color: #7dd3fc; }
  .btn-edit    { background: #1e2330; color: #94a3b8; border: 1px solid #2d3348; }

  #error-msg { font-size: 12px; color: #f87171; padding: 4px 8px; display: none; }

  main { padding: 20px 24px; }

  .table-wrap {
    background: #111318;
    border: 1px solid #2d3348;
    border-radius: 10px;
    overflow: hidden;
    overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; min-width: 1000px; }
  thead tr { background: #0d1017; }
  th {
    padding: 11px 14px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .6px; color: #64748b;
    white-space: nowrap; border-bottom: 1px solid #2d3348; text-align: left;
  }
  td {
    padding: 10px 14px; font-size: 13px;
    border-bottom: 1px solid #1e2330; white-space: nowrap; vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #161b27; }

  tr.color-green td  { background: rgba(34,197,94,.07); }
  tr.color-yellow td { background: rgba(234,179,8,.08); }
  tr.color-red td    { background: rgba(239,68,68,.10); }
  tr.color-green:hover td  { background: rgba(34,197,94,.13); }
  tr.color-yellow:hover td { background: rgba(234,179,8,.14); }
  tr.color-red:hover td    { background: rgba(239,68,68,.16); }

  .badge {
    display: inline-block; border-radius: 4px;
    font-size: 11px; font-weight: 600; padding: 2px 8px;
  }
  .badge-green  { background: rgba(34,197,94,.15); color: #4ade80; }
  .badge-yellow { background: rgba(234,179,8,.15); color: #fde047; }
  .badge-red    { background: rgba(239,68,68,.18); color: #f87171; }
  .badge-none   { background: #1e2330; color: #64748b; }

  /* Тип принтера */
  .type-badge {
    display: inline-block; border-radius: 4px;
    font-size: 10px; font-weight: 700; padding: 2px 7px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .type-html { background: rgba(168,85,247,.15); color: #c084fc; }
  .type-xml  { background: rgba(59,130,246,.15);  color: #7dd3fc; }

  .status-ok   { color: #4ade80; }
  .status-warn { color: #fde047; }
  .status-err  { color: #f87171; }
  .status-poll { color: #64748b; font-style: italic; }

  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #2d3348; border-top-color: #3b82f6;
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .editable {
    cursor: pointer; border-bottom: 1px dashed #2d3348; padding-bottom: 1px;
  }
  .editable:hover { border-bottom-color: #3b82f6; color: #93c5fd; }
  .inline-input {
    background: #1e2330; border: 1px solid #3b82f6; border-radius: 4px;
    color: #e2e8f0; font-size: 13px; padding: 3px 6px; width: 120px; outline: none;
  }

  .empty-row td { text-align: center; color: #475569; padding: 40px; font-size: 14px; }
  .refresh-info { font-size: 11px; color: #475569; }
  #countdown { color: #64748b; }

  /* Заглушка «—» для неприменимой колонки */
  .na { color: #2d3348; font-size: 12px; }

  /* Кнопка журнала */
  .btn-service { background: #1e3348; color: #a78bfa; border: 1px solid #312e81; }

  /* Последняя запись обслуживания в таблице */
  .svc-last { font-size: 11px; color: #94a3b8; max-width: 160px; white-space: normal; line-height: 1.4; }
  .svc-last .svc-type { color: #a78bfa; font-weight: 600; }
  .svc-last .svc-date { color: #64748b; }

  /* Модальное окно */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #111318; border: 1px solid #2d3348; border-radius: 12px;
    width: 560px; max-width: 95vw; max-height: 90vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid #2d3348;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h2 { font-size: 15px; font-weight: 600; color: #f1f5f9; }
  .modal-close { background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: #f87171; }
  .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }

  .svc-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .svc-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .svc-form label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
  .svc-form input, .svc-form select, .svc-form textarea {
    background: #1e2330; border: 1px solid #2d3348; border-radius: 6px;
    color: #e2e8f0; font-size: 13px; padding: 7px 10px; outline: none;
    transition: border-color .15s; font-family: inherit;
  }
  .svc-form input:focus, .svc-form select:focus, .svc-form textarea:focus { border-color: #3b82f6; }
  .svc-form select { width: 180px; }
  .svc-form input[type=date] { width: 150px; color-scheme: dark; }
  .svc-form textarea { width: 100%; height: 60px; resize: vertical; }

  .svc-list { display: flex; flex-direction: column; gap: 8px; }
  .svc-entry {
    background: #1a1d23; border: 1px solid #2d3348; border-radius: 8px;
    padding: 10px 12px; display: flex; align-items: flex-start; gap: 10px;
  }
  .svc-entry-info { flex: 1; }
  .svc-entry-type {
    font-size: 12px; font-weight: 600; color: #a78bfa;
    background: rgba(167,139,250,.1); border-radius: 4px;
    padding: 2px 8px; display: inline-block; margin-bottom: 4px;
  }
  .svc-entry-date { font-size: 11px; color: #64748b; margin-bottom: 4px; }
  .svc-entry-comment { font-size: 13px; color: #cbd5e1; white-space: pre-wrap; }
  .svc-entry-del { background: none; border: none; color: #475569; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px; }
  .svc-entry-del:hover { color: #f87171; }
  .svc-empty { text-align: center; color: #475569; padding: 24px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:20px">
    <div>
      <h1>🖨️ Мониторинг принтеров HP</h1>
      <div class="header-sub refresh-info">Авто-обновление через <span id="countdown">60</span> с</div>
    </div>
    <nav class="main-nav">
      <a href="/"        class="nav-link nav-active">🖨️ Принтери</a>
      <a href="/cameras" class="nav-link">📹 Відеонагляд</a>
      <a href="/alerts"  class="nav-link">🔔 Сповіщення</a>
    </nav>
  </div>

  <div class="add-bar">
    <div id="error-msg"></div>

    <label>IP</label>
    <input id="ip" placeholder="192.168.1.10" onkeydown="if(event.key==='Enter')addPrinter()">

    <label>Место</label>
    <input id="location" placeholder="Кабинет 101" onkeydown="if(event.key==='Enter')addPrinter()">

    <label>Макс. стр.</label>
    <input id="max" placeholder="6000" type="number" onkeydown="if(event.key==='Enter')addPrinter()">

    <label>Тип</label>
    <select id="ptype">
      <option value="html">HTML (старый)</option>
      <option value="xml">XML (новый)</option>
    </select>

    <button class="btn btn-primary" onclick="addPrinter()">+ Добавить</button>
    <button class="btn btn-refresh" onclick="refreshAll()">↻ Обновить все</button>
    <a href="/logout" class="btn" style="background:#374151;color:#e2e8f0;text-decoration:none;">Выйти</a>
  </div>
</header>

<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>IP-адрес</th>
          <th>Тип</th>
          <th>Местоположение</th>
          <th>Модель</th>
          <th>Всего стр.</th>
          <th>Индекс картриджа</th>
          <th>С замены</th>
          <th>Макс. стр.</th>
          <th>Состояние</th>
          <th>Обслуживание</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="empty-row"><td colspan="11">Добавьте принтер, чтобы начать мониторинг</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Модальное окно журнала обслуживания -->
<div class="modal-overlay" id="svcModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="svcModalTitle">Журнал обслуживания</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="svc-form">
        <div class="svc-form-row">
          <div>
            <label>Дата</label>
            <input type="date" id="svcDate">
          </div>
          <div>
            <label>Тип работы</label>
            <select id="svcType">
              <option value="Замена картриджа">Замена картриджа</option>
              <option value="Заправка картриджа">Заправка картриджа</option>
              <option value="Замена фотобарабана">Замена фотобарабана</option>
              <option value="Замена термоплёнки">Замена термоплёнки</option>
              <option value="Замена резинового вала">Замена резинового вала</option>
              <option value="Чистка принтера">Чистка принтера</option>
              <option value="Ремонт">Ремонт</option>
              <option value="Другое">Другое</option>
            </select>
          </div>
        </div>
        <div>
          <label>Комментарий</label>
          <textarea id="svcComment" placeholder="Дополнительная информация..."></textarea>
        </div>
        <div>
          <button class="btn btn-primary btn-sm" onclick="addServiceEntry()">+ Добавить запись</button>
        </div>
      </div>
      <div id="svcList" class="svc-list"></div>
    </div>
  </div>
</div>

<script>
let currentSvcIp = null;
let printersData  = [];
let countdown     = 60;
let fastPoll      = false;  // флаг: активен ли быстрый опрос
let pollTimer     = null;   // ID таймера для clearTimeout

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = msg ? 'inline' : 'none';
}

function resetCountdown() {
  countdown = 60;
  document.getElementById('countdown').textContent = countdown;
}

function statusClass(status) {
  if (!status || status === '—' || status.includes('Опрос') || status.includes('Обновление'))
    return 'status-poll';
  const s = status.toLowerCase();
  if (s.includes('замятие') || s.includes('ошибка') || s.includes('недоступ') || s.includes('нет бумаги'))
    return 'status-err';
  if (s.includes('внимание') || s.includes('низкий') || s.includes('предупреждение'))
    return 'status-warn';
  return 'status-ok';
}

function badgeHtml(color, since) {
  if (color === 'none' || since === '—')
    return `<span class="badge badge-none">${since}</span>`;
  return `<span class="badge badge-${color}">${since}</span>`;
}

function fmtDate(d) {
  if (!d) return '';
  // принимает YYYY-MM-DD, возвращает ДД.ММ.ГГГГ
  const parts = d.split('-');
  if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
  return d;
}

function lastServiceHtml(log) {
  if (!log || !log.length) return '<span style="color:#475569;font-size:11px">Нет записей</span>';
  const e = log[0];
  return `<div class="svc-last">
    <span class="svc-type">${e.type}</span>
    <span class="svc-date"> ${fmtDate(e.date)}</span>
    ${e.comment ? `<div style="color:#94a3b8;margin-top:2px">${e.comment.substring(0,40)}${e.comment.length>40?'…':''}</div>` : ''}
  </div>`;
}

function renderTable(data) {
  printersData = data;
  const tbody = document.getElementById('tbody');
  if (!data.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="11">Добавьте принтер, чтобы начать мониторинг</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(p => {
    const spinner     = p.polling ? '<span class="spinner"></span>' : '';
    const sc          = statusClass(p.status);
    const colorClass  = p.color !== 'none' ? `color-${p.color}` : '';
    const isHtml      = p.type === 'html';
    const typeBadge   = isHtml
      ? `<span class="type-badge type-html">HTML</span>`
      : `<span class="type-badge type-xml">XML</span>`;

    const cartridge = isHtml
      ? `<span style="font-family:monospace;font-size:12px">${p.cartridge}</span>`
      : `<span style="font-family:monospace;font-size:12px">${p.cartridge_index}</span>`;

    return `<tr class="${colorClass}" data-ip="${p.ip}">
      <td><code style="font-size:12px;color:#7dd3fc">${p.ip}</code></td>
      <td>${typeBadge}</td>
      <td>
        <span class="editable" onclick="editLocation('${p.ip}', this)">
          ${p.location || '<span style="color:#475569">—</span>'}
        </span>
      </td>
      <td>${spinner}${p.model}</td>
      <td style="text-align:center">${p.pages}</td>
      <td style="text-align:center">${cartridge}</td>
      <td style="text-align:center">${badgeHtml(p.color, p.since_replace)}</td>
      <td style="text-align:center">
        <span class="editable" onclick="editMaxPages('${p.ip}', this)">
          ${p.max_pages || '<span style="color:#475569">—</span>'}
        </span>
      </td>
      <td class="${sc}">${p.status}</td>
      <td>${lastServiceHtml(p.service_log)}</td>
      <td>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="btn btn-sm btn-service" onclick="openModal('${p.ip}')"        title="Журнал обслуживания">📋</button>
          <button class="btn btn-sm btn-replace" onclick="replaceCartridge('${p.ip}')" title="Замена картриджа">🖨️ Замена</button>
          <button class="btn btn-sm btn-edit"    onclick="refreshOne('${p.ip}')"       title="Обновить">↻</button>
          <button class="btn btn-sm btn-danger"  onclick="deletePrinter('${p.ip}')"   title="Удалить">✕</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function load() {
  try {
    const r    = await fetch('/printers');
    const data = await r.json();
    renderTable(data);
    if (data.some(p => p.polling)) startFastPoll();
  } catch(e) {}
}

async function addPrinter() {
  const ip    = document.getElementById('ip').value.trim();
  const loc   = document.getElementById('location').value.trim();
  const max   = document.getElementById('max').value.trim();
  const ptype = document.getElementById('ptype').value;
  if (!ip) { showError('Введите IP-адрес'); return; }
  showError('');

  const body = new URLSearchParams({ ip, location: loc, max, type: ptype });
  const r    = await fetch('/add', { method: 'POST', body });
  const data = await r.json();
  if (data.error) { showError(data.error); return; }

  document.getElementById('ip').value       = '';
  document.getElementById('location').value = '';
  document.getElementById('max').value      = '';
  resetCountdown();
  load();
}

async function deletePrinter(ip) {
  if (!confirm(`Удалить принтер ${ip}?`)) return;
  await fetch('/delete/' + ip, { method: 'POST' });
  resetCountdown(); load();
}

async function refreshAll() {
  fetch('/refresh', { method: 'POST' });  // не ждём
  resetCountdown();
  load();
  startFastPoll();
}

async function refreshOne(ip) {
  fetch('/refresh/' + ip, { method: 'POST' });  // не ждём
  resetCountdown();
  load();
  startFastPoll();
}

async function replaceCartridge(ip) {
  if (!confirm(`Подтвердите замену картриджа на принтере ${ip}.\nСчётчик «С замены» будет сброшен.`)) return;
  await fetch('/replace/' + ip, { method: 'POST' });
  resetCountdown(); load();
}

function editLocation(ip, span) {
  const current = span.textContent.trim() === '—' ? '' : span.textContent.trim();
  const input   = document.createElement('input');
  input.className   = 'inline-input';
  input.value       = current;
  input.placeholder = 'Кабинет 101';
  span.replaceWith(input);
  input.focus();
  async function save() {
    await fetch('/update/' + ip, { method: 'POST', body: new URLSearchParams({ location: input.value.trim() }) });
    resetCountdown(); load();
  }
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => { if (e.key==='Enter') save(); if (e.key==='Escape') load(); });
}

function editMaxPages(ip, span) {
  const current = span.textContent.trim() === '—' ? '' : span.textContent.trim();
  const input   = document.createElement('input');
  input.className   = 'inline-input';
  input.type        = 'number';
  input.value       = current;
  input.placeholder = '6000';
  input.style.width = '80px';
  span.replaceWith(input);
  input.focus();
  async function save() {
    const r    = await fetch('/update/' + ip, { method: 'POST', body: new URLSearchParams({ max_pages: input.value.trim() }) });
    const data = await r.json();
    if (data.error) showError(data.error);
    resetCountdown(); load();
  }
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => { if (e.key==='Enter') save(); if (e.key==='Escape') load(); });
}

// ── Журнал обслуживания ───────────────────────────────────────────────────
function openModal(ip) {
  currentSvcIp = ip;
  const p = printersData.find(x => x.ip === ip);
  document.getElementById('svcModalTitle').textContent =
    `Журнал обслуживания — ${ip}${p && p.location ? ' (' + p.location + ')' : ''}`;
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('svcDate').value    = today;
  document.getElementById('svcComment').value = '';
  renderServiceList(p ? (p.service_log || []) : []);
  document.getElementById('svcModal').classList.add('open');
}

function closeModal() {
  document.getElementById('svcModal').classList.remove('open');
  currentSvcIp = null;
}

document.getElementById('svcModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function renderServiceList(log) {
  const el = document.getElementById('svcList');
  if (!log.length) { el.innerHTML = '<div class="svc-empty">Записей пока нет</div>'; return; }
  el.innerHTML = log.map((e, i) => `
    <div class="svc-entry">
      <div class="svc-entry-info">
        <span class="svc-entry-type">${e.type}</span>
        <div class="svc-entry-date">📅 ${fmtDate(e.date)}</div>
        ${e.comment ? `<div class="svc-entry-comment">${e.comment}</div>` : ''}
      </div>
      <button class="svc-entry-del" onclick="deleteServiceEntry(${i})" title="Удалить запись">🗑</button>
    </div>
  `).join('');
}

async function addServiceEntry() {
  if (!currentSvcIp) return;
  const date    = document.getElementById('svcDate').value.trim();
  const type    = document.getElementById('svcType').value.trim();
  const comment = document.getElementById('svcComment').value.trim();
  if (!date) { alert('Укажите дату'); return; }
  const r    = await fetch('/service/' + currentSvcIp, {
    method: 'POST', body: new URLSearchParams({ date, type, comment })
  });
  const data = await r.json();
  if (data.error) { alert(data.error); return; }
  await load();
  const p = printersData.find(x => x.ip === currentSvcIp);
  renderServiceList(p ? (p.service_log || []) : []);
  document.getElementById('svcComment').value = '';
}

async function deleteServiceEntry(idx) {
  if (!confirm('Удалить эту запись?')) return;
  const r    = await fetch(`/service/${currentSvcIp}/${idx}`, { method: 'DELETE' });
  const data = await r.json();
  if (data.error) { alert(data.error); return; }
  await load();
  const p = printersData.find(x => x.ip === currentSvcIp);
  renderServiceList(p ? (p.service_log || []) : []);
}

// ── Таймер авто-обновления ────────────────────────────────────────────────

function startFastPoll() {
  if (fastPoll) return;
  fastPoll = true;
  async function poll() {
    if (!fastPoll) return;
    await load();
    if (!printersData.some(p => p.polling)) {
      fastPoll  = false;
      pollTimer = null;
      countdown = 60;
      return;
    }
    pollTimer = setTimeout(poll, 2000);
  }
  pollTimer = setTimeout(poll, 2000);
}

function tick() {
  document.getElementById('countdown').textContent = countdown;
  if (countdown <= 0) {
    countdown = 60;
    fetch('/refresh', { method: 'POST' });  // запускаем опрос на сервере
    load();
    startFastPoll();  // быстро подхватим результат
  } else {
    countdown--;
  }
}
setInterval(tick, 1000);
load();
</script>
</body>
